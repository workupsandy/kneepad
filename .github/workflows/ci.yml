name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ${{ matrix.os }}
    # Windows is new in 0.3.0 and its CI has not been seen green yet. It reports failures but does not block
    # merges until it has passed a few times; then delete the next line.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Rule database is in sync with the generators
        if: runner.os == 'Linux'
        run: |
          python tools/gen_rules.py
          python tools/gen_platform_rules.py
          python tools/gen_docs.py
          git diff --exit-code
      - name: Tests
        if: runner.os != 'Windows'
        run: python -m unittest discover -s tests
      - name: Tests (Windows subset)
        # Most of the older suite builds POSIX paths and shell scripts; porting it is tracked work. The platform
        # tests, the rule database examples and the audit tests run here.
        if: runner.os == 'Windows'
        run: |
          python -m unittest discover -s tests -p "test_platforms.py"
          python -m unittest discover -s tests -p "test_rules_db.py"
      - name: Build and smoke-test the wheel
        run: |
          python -m pip install build
          python -m build
          python -m pip install dist/*.whl
          kneepad --version
          set +e; kneepad check 'terraform destroy -auto-approve'; code=$?; set -e; test $code -eq 20
          python tools/smoke_hook.py
