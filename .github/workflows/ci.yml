name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ${{ matrix.os }}
    # Windows is new in 0.3.0 and its CI has not been seen green yet. It reports failures but does not block
    # merges until it has passed a few times; then delete the next line.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Rule database is in sync with the generators
        if: runner.os == 'Linux'
        run: |
          python tools/gen_rules.py
          python tools/gen_platform_rules.py
          python tools/gen_docs.py
          git diff --exit-code
      - name: Tests
        if: runner.os != 'Windows'
        run: python tools/ci_run_tests.py
      - name: Tests (Windows subset, gating)
        # The platform tests, the rule database examples and the audit tests must pass on Windows.
        if: runner.os == 'Windows'
        run: |
          python tools/ci_run_tests.py -p "test_platforms.py"
          python tools/ci_run_tests.py -p "test_rules_db.py"
      - name: Tests (Windows full suite, informational)
        # Most of the older suite builds POSIX paths and shell scripts. Failures here are listed in an annotation so
        # they can be ported one by one; they do not fail the job.
        if: runner.os == 'Windows'
        continue-on-error: true
        run: python tools/ci_run_tests.py
      - name: Build and smoke-test the wheel
        run: |
          python -m pip install build
          python -m build
          python -m pip install dist/*.whl
          kneepad --version
          set +e; kneepad check 'terraform destroy -auto-approve'; code=$?; set -e; test $code -eq 20
          python tools/smoke_hook.py
      - name: End-to-end QA of the built wheel (fresh virtualenv, every command)
        continue-on-error: ${{ runner.os == 'Windows' }}
        run: python tools/qa_e2e.py --spec "dist/*.whl" --quick --report qa-report.json
      - name: Upload QA report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: qa-report-${{ matrix.os }}-py${{ matrix.python }}
          path: qa-report.json
          if-no-files-found: ignore
