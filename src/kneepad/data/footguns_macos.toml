# Generated by tools/gen_platform_rules.py. Edit the generator, not this file.

[[rule]]
id = "mac-disk-erase"
title = "diskutil erase, partition, reformat or APFS delete"
family = "macos"
severity = "critical"
action = "deny"
why = "These diskutil verbs erase or repartition a disk or volume. The data is gone and Time Machine will not help if the target was the backup disk."
safer = "Run diskutil list and diskutil info on the target first and make sure it is not the boot or backup disk."
reversible = "no"
[rule.match]
cmd = ["diskutil"]
args_regex = '(?i)^\s*(?:(?:erase\S*|partitiondisk|splitpartition|mergepartitions|reformat|securerase|zerodisk|randomdisk|resizevolume|repartitiondisk|secureerase)\b|apfs\s+(?:delete\S*|erase\S*|resize\S*)|appleraid\s+delete|cs\s+delete)'
[rule.examples]
match = ["diskutil eraseDisk APFS Mac disk2", "diskutil eraseVolume HFS+ x /Volumes/x", "diskutil partitionDisk disk3 GPT JHFS+ n 0b", "diskutil secureErase 0 disk2", "diskutil apfs deleteVolume disk1s2", "diskutil apfs deleteContainer disk4", "diskutil zeroDisk disk2"]
no_match = ["diskutil list", "diskutil info disk0", "diskutil unmount /Volumes/x", "diskutil mount disk2s1"]

[[rule]]
id = "mac-asr-restore"
title = "asr restore (overwrites a volume from an image)"
family = "macos"
severity = "critical"
action = "deny"
why = "asr restore overwrites the target volume with an image. A wrong target erases the wrong disk."
safer = "Check the target with diskutil info and keep a backup."
reversible = "no"
[rule.match]
cmd = ["asr"]
args_regex = '(?i)(?:^|\s)(?:restore|--erase)\b'
[rule.examples]
match = ["asr restore --source a.dmg --target /Volumes/x --erase", "asr restore -s a.dmg -t /Volumes/y"]
no_match = ["asr imagescan --source a.dmg", "echo asr restore"]

[[rule]]
id = "mac-csrutil"
title = "csrutil disable (System Integrity Protection)"
family = "macos"
severity = "high"
action = "ask"
why = "Turning off SIP removes the protection of system files and lets any process modify them."
safer = "Keep SIP on. If you need to debug something, scope the exception narrowly and re-enable it."
reversible = "no"
[rule.match]
cmd = ["csrutil"]
args_regex = '(?i)(?:disable|clear|enable\s+--without)'
[rule.examples]
match = ["csrutil disable", "csrutil authenticated-root disable", "csrutil clear"]
no_match = ["csrutil status", "echo csrutil disable"]

[[rule]]
id = "mac-kmutil"
title = "kmutil load, unload, install or configure-boot (kernel extensions)"
family = "macos"
severity = "high"
action = "ask"
why = "Loading or unloading kernel extensions and changing boot policy can destabilise or disable security on the Mac."
safer = "Use kmutil showloaded to inspect, and only install extensions from vendors you trust."
reversible = "no"
[rule.match]
cmd = ["kmutil"]
args_regex = '(?i)^\s*(?:load|unload|install|create|configure-boot|clear-staging|trigger-panic-stackshot)\b'
[rule.examples]
match = ["kmutil load -p /Library/Extensions/x.kext", "kmutil unload -b com.x", "sudo kmutil configure-boot -c x -v /Volumes/y"]
no_match = ["kmutil showloaded", "kmutil inspect -b com.x"]

[[rule]]
id = "mac-gatekeeper-off"
title = "turn off Gatekeeper (spctl)"
family = "macos"
severity = "high"
action = "ask"
why = "Disabling Gatekeeper lets unsigned and unnotarised apps run without a prompt."
safer = "Open the one app you trust via System Settings, Privacy and Security."
reversible = "no"
[rule.match]
cmd = ["spctl"]
args_regex = '(?i)(?:--master-disable|--global-disable|--disable\b)'
[rule.examples]
match = ["spctl --master-disable", "sudo spctl --global-disable"]
no_match = ["spctl --status", "spctl --assess -v App.app"]

[[rule]]
id = "mac-xattr-quarantine"
title = "remove quarantine or all extended attributes (xattr -d com.apple.quarantine, -c)"
family = "macos"
severity = "medium"
action = "ask"
why = "Removing quarantine skips Gatekeeper checks for that file. xattr -c also strips every other attribute (tags, resource forks, download origin)."
safer = "Remove the attribute from a single file you downloaded yourself and verified."
reversible = "no"
[rule.match]
cmd = ["xattr"]
args_regex = '(?i)(?:-\w*d\w*\s+com\.apple\.quarantine|(?:^|\s)-\w*c\w*(?:\s|$))'
[rule.examples]
match = ["xattr -d com.apple.quarantine App.app", "xattr -cr /Applications/Foo.app", "xattr -dr com.apple.quarantine ."]
no_match = ["xattr -l file", "xattr file", "xattr -w user.x y file"]

[[rule]]
id = "mac-timemachine"
title = "Time Machine delete, disable or thin snapshots (tmutil)"
family = "macos"
severity = "high"
action = "ask"
why = "These commands delete backups or local snapshots, or turn backups off. They remove your restore points."
safer = "Run tmutil listbackups and tmutil listlocalsnapshots first and delete one named item."
reversible = "no"
[rule.match]
cmd = ["tmutil"]
args_regex = '(?i)^\s*(?:delete|deletelocalsnapshots|disable|disablelocal|thinlocalsnapshots|removedestination|restore)\b'
[rule.examples]
match = ["tmutil deletelocalsnapshots 2024-01-01-000000", "tmutil delete -d /Volumes/b -t 2024-01-01", "tmutil disable", "tmutil thinlocalsnapshots / 10000000000 4", "tmutil removedestination ABC"]
no_match = ["tmutil listbackups", "tmutil status", "tmutil startbackup"]

[[rule]]
id = "mac-launchd"
title = "launchctl bootout, unload, remove, disable or kickstart -k"
family = "macos"
severity = "high"
action = "ask"
why = "Unloading or disabling launchd jobs can stop system services, security tools and MDM agents. Loading one with -w makes it persistent."
safer = "Run launchctl print on the label first and change one user agent rather than a system daemon."
reversible = "no"
[rule.match]
cmd = ["launchctl"]
args_regex = '(?i)(?:^|\s)(?:bootout|unload|remove|disable|kill|kickstart\s+-k|bootstrap\s+system|load\s+-w)\b'
[rule.examples]
match = ["launchctl bootout system/com.apple.foo", "sudo launchctl unload /Library/LaunchDaemons/x.plist", "launchctl remove com.x", "launchctl disable gui/501/com.x"]
no_match = ["launchctl list", "launchctl print system", "launchctl load ~/Library/LaunchAgents/x.plist"]

[[rule]]
id = "mac-defaults-delete"
title = "defaults delete (removes a preference domain or key)"
family = "macos"
severity = "medium"
action = "ask"
why = "defaults delete removes saved preferences for an app or for the whole system. Apps may reset or misbehave."
safer = "Run defaults read first and export the domain: defaults export com.example.app backup.plist."
reversible = "no"
[rule.match]
cmd = ["defaults"]
args_regex = '(?i)^\s*(?:-currenthost\s+)?(?:delete|remove)\b'
[rule.examples]
match = ["defaults delete com.apple.dock", "defaults delete -g AppleLanguages", "defaults -currentHost delete com.apple.x"]
no_match = ["defaults read com.apple.dock", "defaults write com.apple.dock autohide -bool true"]

[[rule]]
id = "mac-accounts"
title = "create, delete or change accounts and admin group (dscl, sysadminctl, dseditgroup)"
family = "macos"
severity = "high"
action = "ask"
why = "Account changes create backdoors, remove people's data or lock users out. Adding an account to admin is a privilege escalation."
safer = "Use System Settings or your MDM, and list the account first (dscl . -read /Users/name)."
reversible = "no"
[rule.match]
cmd = ["dscl", "sysadminctl", "dseditgroup"]
args_regex = '(?i)(?:-delete|-create|-append|-merge|-change|-passwd|-adduser|-deleteuser|-securetokenoff|-resetpasswordfor|(?:^|\s)-o\s+edit\b)'
[rule.examples]
match = ["dscl . -delete /Users/bob", "sysadminctl -deleteUser bob", "dseditgroup -o edit -a eve -t user admin", "dscl . -create /Users/x UserShell /bin/zsh"]
no_match = ["dscl . -read /Users/bob", "dscl . -list /Users", "sysadminctl -secureTokenStatus bob", "dseditgroup -o read admin"]

[[rule]]
id = "mac-keychain"
title = "security: delete keychain items, dump keychains, print secrets, trust certificates"
family = "macos"
severity = "high"
action = "ask"
why = "These commands delete credentials, print passwords in clear text, export keys or make the system trust a new certificate authority."
safer = "Use Keychain Access for one item and never print secrets into a shell an agent can read."
reversible = "no"
[rule.match]
cmd = ["security"]
args_regex = '(?i)(?:delete-(?:keychain|generic-password|internet-password|certificate|identity)|remove-trusted-cert|dump-keychain|(?:^|\s)export\b|add-trusted-cert|find-(?:generic|internet)-password\b[^|;&]*\s-\w*[wg]\w*)'
[rule.examples]
match = ["security delete-keychain login.keychain-db", "security delete-generic-password -s foo", "security dump-keychain -d login.keychain", "security find-generic-password -s foo -w", "security add-trusted-cert -d -r trustRoot -k /Library/Keychains/System.keychain ca.pem", "security export -k login.keychain -t certs -f pemseq"]
no_match = ["security list-keychains", "security find-identity -v -p codesigning", "security find-generic-password -s foo", "security default-keychain"]

[[rule]]
id = "mac-nvram"
title = "nvram clear or delete (firmware variables)"
family = "macos"
severity = "high"
action = "ask"
why = "Clearing NVRAM or changing boot-args alters how the Mac boots and can disable security options."
safer = "Run nvram -p and save the output before changing anything."
reversible = "no"
[rule.match]
cmd = ["nvram"]
args_regex = '(?i)(?:^|\s)(?:-c|-d\s+\S+)(?:\s|$)|boot-args='
[rule.examples]
match = ["nvram -c", "nvram -d boot-args", "sudo nvram boot-args=-v"]
no_match = ["nvram -p", "nvram boot-args"]

[[rule]]
id = "mac-osascript-risky"
title = "osascript that elevates, empties the trash, shuts down, restarts or sends keystrokes"
family = "macos"
severity = "high"
action = "ask"
why = "AppleScript can run commands as administrator, drive other apps through the UI and act as a keyboard, which is a way around other safeguards."
safer = "Run the specific command directly so it can be reviewed, and ask the user for anything that needs administrator rights."
reversible = "no"
[rule.match]
cmd = ["osascript"]
args_regex = '(?i)(?:with administrator privileges|empty trash|shut down|restart|log out|keystroke|key code)'
[rule.examples]
match = ["osascript -e \"tell app \\\"Finder\\\" to empty trash\"", "osascript -e \"tell app \\\"System Events\\\" to shut down\"", "osascript -e \"do shell script \\\"id\\\" with administrator privileges\"", "osascript -e \"tell application \\\"System Events\\\" to keystroke \\\"q\\\" using command down\""]
no_match = ["osascript -e \"display notification \\\"hi\\\"\"", "osascript -e \"tell application \\\"Safari\\\" to get URL of current tab of window 1\""]

[[rule]]
id = "mac-kill-session"
title = "kill WindowServer, loginwindow, launchd or other session processes"
family = "macos"
severity = "medium"
action = "ask"
why = "Killing these processes logs you out, loses unsaved work in every app or panics the system."
safer = "Restart the one app you need to restart."
reversible = "no"
[rule.match]
cmd = ["killall", "pkill"]
args_regex = '(?i)(?:^|\s)(?:-\d+\s+|-kill\s+|-sigkill\s+)?(?:windowserver|loginwindow|launchd|securityd|opendirectoryd|kernel_task)\b'
[rule.examples]
match = ["killall -9 WindowServer", "killall loginwindow", "pkill -9 launchd"]
no_match = ["killall Dock", "killall Finder", "killall node"]

[[rule]]
id = "mac-firewall-off"
title = "turn off or flush the macOS firewall (pfctl, socketfilterfw)"
family = "macos"
severity = "high"
action = "ask"
why = "Disabling or flushing the firewall exposes every listening service to the network."
safer = "Add an allow rule for the one app instead."
reversible = "no"
[rule.match]
cmd = ["pfctl", "socketfilterfw"]
args_regex = '(?i)(?:-d\b|-f\s+all|--setglobalstate\s+off|--setblockall\s+off|--setstealthmode\s+off)'
[rule.examples]
match = ["pfctl -d", "pfctl -F all", "/usr/libexec/ApplicationFirewall/socketfilterfw --setglobalstate off"]
no_match = ["pfctl -s rules", "pfctl -e", "socketfilterfw --getglobalstate"]

[[rule]]
id = "mac-networksetup"
title = "networksetup: change DNS, proxies or remove network services"
family = "macos"
severity = "medium"
action = "ask"
why = "Changing DNS or proxy settings redirects every connection on the machine, and removing a service can cut your connectivity."
safer = "Run networksetup -getdnsservers and note the current values before changing them."
reversible = "no"
[rule.match]
cmd = ["networksetup"]
args_regex = '(?i)^\s*-(?:setdnsservers|setwebproxy|setsecurewebproxy|setautoproxyurl|setproxybypassdomains|removepreferredwirelessnetwork|removenetworkservice|deletepppoeservice|setv6off|setnetworkserviceenabled)\b'
[rule.examples]
match = ["networksetup -setdnsservers Wi-Fi 8.8.8.8", "networksetup -setwebproxy Wi-Fi 127.0.0.1 8080", "sudo networksetup -removenetworkservice Ethernet"]
no_match = ["networksetup -listallnetworkservices", "networksetup -getdnsservers Wi-Fi"]

[[rule]]
id = "mac-tcc-reset"
title = "tccutil reset (clears privacy permissions)"
family = "macos"
severity = "medium"
action = "ask"
why = "Resetting TCC clears camera, microphone, screen recording and file access approvals for apps."
safer = "Reset one service for one bundle id, not All."
reversible = "no"
[rule.match]
cmd = ["tccutil"]
args_regex = '(?i)^\s*reset\b'
[rule.examples]
match = ["tccutil reset All", "tccutil reset Camera com.x"]
no_match = ["echo tccutil reset All", "tccutil"]

[[rule]]
id = "mac-profiles"
title = "profiles: install or remove configuration and MDM profiles"
family = "macos"
severity = "high"
action = "ask"
why = "Configuration profiles carry certificates, VPN, Wi-Fi and security policy. Removing an MDM profile can unenrol a managed device."
safer = "List installed profiles and talk to your admin before removing one."
reversible = "no"
[rule.match]
cmd = ["profiles"]
args_regex = '(?i)(?:^|\s)(?:remove|install|-D|-R|-F)\b'
[rule.examples]
match = ["profiles remove -all", "profiles -D", "sudo profiles install -path x.mobileconfig"]
no_match = ["profiles list", "echo profiles remove"]

[[rule]]
id = "mac-systemsetup"
title = "systemsetup: enable remote login or change remote events"
family = "macos"
severity = "high"
action = "ask"
why = "Enabling Remote Login or Remote Apple Events opens the Mac to network access."
safer = "Use System Settings, Sharing and limit it to named users."
reversible = "no"
[rule.match]
cmd = ["systemsetup"]
args_regex = '(?i)-set(?:remotelogin|remoteappleevents|wakeonmodem|restartfreeze)\b'
[rule.examples]
match = ["systemsetup -setremotelogin on", "sudo systemsetup -setremoteappleevents on"]
no_match = ["systemsetup -getremotelogin", "systemsetup -gettimezone"]
