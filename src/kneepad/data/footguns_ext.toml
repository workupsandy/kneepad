[[rule]]
id = "cloud-cli-delete-generic"
title = "delete or destroy on a cloud provider CLI"
family = "cloud"
severity = "high"
action = "ask"
why = "The command deletes cloud resources by name. Cloud deletes are normally immediate and not recoverable from the CLI."
safer = "Run the matching list or describe command first and confirm the resource id. Prefer a dry run or a snapshot."
reversible = "no"
[rule.match]
cmd_re = '(?:ibmcloud|oci|aliyun|linode-cli|hcloud|vultr-cli|scw|exo|ovhcloud|upctl|civo|metal|tccli|ecl|openstack|rackspace|doctl|cf|heroku|fly|flyctl|railway|render|scalingo|clever|platform|upsun|dokku|koyeb|northflank|zeabur)'
args_regex = '(?:^|[\s:-])(?:delete|destroy|terminate|purge)\b'
[rule.examples]
match = ["oci compute instance terminate --instance-id x", "hcloud server delete web1", "ibmcloud ks cluster-delete mycluster", "scw instance server delete abc", "linode-cli linodes delete 123"]
no_match = ["hcloud server list", "oci compute instance list", "echo hcloud server delete web1"]

[[rule]]
id = "openstack-delete"
title = "openstack resource deletion"
family = "cloud"
severity = "high"
action = "ask"
why = "OpenStack deletions are immediate and cascade to attached volumes or ports in some cases."
safer = "List the resource first and check attached volumes and floating IPs."
reversible = "no"
[rule.match]
cmd_re = 'openstack'
args_regex = '(?:^|\s)(?:\S+\s+){0,3}(?:delete|purge|remove|unset --all)\b'
[rule.examples]
match = ["openstack server delete web1", "openstack project purge --project x"]
no_match = ["openstack server list"]

